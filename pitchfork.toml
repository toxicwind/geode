# Per-pen pitchfork config — partitioned from estate monolith 2026-10-29 (v2, sub-tables intact)
# geode pen — product-owned daemon manifest (namespace: geode).
# The mineral-family products own their lifecycle here, not in the estate
# control plane: the pen is the inference plane (catalog, routers, engines).
# Migrated from estate/pitchfork.toml 2026-10-26 during the geode rename.

[daemons.chalcopyrite]
run = "exec ./chalcopyrite-serve.sh"
auto = ["start"]
retry = true
ready_http = "http://127.0.0.1:25200/health"
port = 25200
expected_port = [25200]
dir = "/home/toxic/pens/geode/products/chalcopyrite"
[daemons.chalcopyrite.health_http]
url = "http://127.0.0.1:25200/health"
interval = "30s"
timeout = "5s"
retries = 3
[daemons.chalcopyrite.env]
CHALCOPYRITE_PORT = "25200"
CHALCOPYRITE_LOG_LEVEL = "info"

[daemons.bornite]
# 2026-11-10: bornite absorbed mimetite (bornite name deprecated, product
# renamed mimetite) — the merged tree is geode/products/mimetite. This daemon
# runs the Go local/GPU serving plane (astmatrix router + llama-swap) on
# 25100. Old run line pointed at the estate ghost path
# (/home/toxic/pens/estate/stack/services/bornite.sh — ENOENT, exit 127).
run = "exec /home/toxic/pens/geode/products/mimetite/bin/bornite/bornite --config /home/toxic/pens/geode/products/mimetite/config/bornite.yaml"
auto = ["start"]
retry = true
ready_http = "http://127.0.0.1:25100/health"
port = 25100
expected_port = [25100]
depends = ["chalcopyrite"]
dir = "/home/toxic/pens/geode/products/mimetite"
mise = true
[daemons.bornite.health_http]
url = "http://127.0.0.1:25100/health"
interval = "30s"
timeout = "5s"
retries = 3

[daemons.mimetite]
# 2026-11-10: bornite absorbed mimetite (bornite name deprecated) — the
# merged product lives in geode/products/mimetite. The cloud router is
# router/src/server.ts in the merged tree (imports catalog/src/data.ts).
# serve.sh was deleted 2026-11-08; the old run line ENOENT'd every start
# (exit 127) and pitchfork's ready_http never passed, so `pitchfork restart`
# hung forever. one-router product retired — router lives here.
run = "exec ./serve.sh"
auto = ["start"]
retry = true
ready_http = "http://127.0.0.1:25193/health"
port = 25193
expected_port = [25193]
dir = "/home/toxic/pens/geode/products/mimetite/router"
mise = true
[daemons.mimetite.health_http]
url = "http://127.0.0.1:25193/health"
interval = "30s"
timeout = "5s"
retries = 3
[daemons.mimetite.env]
MIMETITE_PORT = "25193"
PORT = "25193"
UNIFIED_ROUTER_PORT = "25193"
DATA_DIR = "/home/toxic/.mimetite-router-data"
HOST = "127.0.0.1"

[groups.mesh]
daemons = ["chalcopyrite", "mimetite", "bornite"]

# Monolith copy dropped 2026-10-29 (partition): geode's own definition above is
# live truth. mise = true note stands (anomaly #43 class): `mise x` exits 2 in
# dirs without toolchain activation, killing the daemon pre-bind; serve.sh execs
# an absolute release binary, so mise adds nothing here.
# 2026-10-29: the former [daemons.mimetite.monolith-note] sub-table was a
# phantom daemon registration (pitchfork parsed it as a second daemon), and
# `run` was `exec ./products/mimetite/proxy/serve.sh` while `dir` already
# pointed at the proxy — the doubled path `proxy/products/...` ENOENT'd every
# start (exit 127). Fixed to `exec ./serve.sh`.

[daemons.toolcall-llm]
# 2026-10-27: the llama.cpp-b11059 build is stale against its own libs
# (wants the pre-rename gml-base.so.0, and libllama.so.0 has an ABI
# mismatch) so it exited 127. Use the beellama.cpp CUDA build.
# The DFlash GGUF is a speculative DRAFT model (it refuses to load alone:
# "dflash requires ctx_other to be set"), so serve the standard
# Qwen3.5-9B Q5_K_M instead.
run = "exec /home/toxic/pens/llama/bin/beellama/llama-server -m /home/toxic/pens/ranch/products/models/qwen3.5-9b-Q5_K_M.gguf --host 127.0.0.1 --port 25152 -ngl 99 -c 32768 --alias qwen3.5-9b-tool"
auto = []
retry = 5
ready_http = "http://127.0.0.1:25152/health"
port = 25152
dir = "/home/toxic/pens/llama/bin/beellama"
mise = true
boot_start = false


[daemons.pens-completions]
run = "exec /home/toxic/.bun/bin/bun /home/toxic/pens/geode/products/pens-completions/server.ts"
auto = ["start"]
retry = true
ready_http = "http://127.0.0.1:25252/health"
port = 25252
boot_start = true
dir = "/home/toxic/pens/geode/products/pens-completions"
[daemons.pens-completions.env]
PENS_COMPLETIONS_PORT = "25252"
MIMETITE_ORIGIN = "http://127.0.0.1:25193"

# bornite-local-lane (2026-11-12): the first-class LOCAL silicon lane (llama-swap).
# qwen2.5-3b on RTX 3090, :25196, NO cap. Local-first router default; cloud only
# on latency budget. Replaces hand-started llama-server with a managed daemon.
[daemons.bornite-local-lane]
run = "exec /home/toxic/pens/geode/products/mimetite/bornite-local-lane.sh"
auto = ["start"]
retry = true
ready_http = "http://127.0.0.1:25196/health"
port = 25196
expected_port = [25196]
dir = "/home/toxic/pens/geode/products/mimetite"
mise = true
[daemons.bornite-local-lane.health_http]
url = "http://127.0.0.1:25196/health"
interval = "30s"
timeout = "5s"
retries = 3
[daemons.bornite-local-lane.env]
LOCAL_LANE_PORT = "25196"
